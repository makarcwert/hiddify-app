# Unsigned Windows build with HWID headers on subscription requests.
# Run it from the Actions tab (Run workflow); the result is the "Hiddify-HWID-Windows" artifact.
name: Build Windows (HWID)

on:
  workflow_dispatch:
  push:
    branches: [hwid]

env:
  CHANNEL: prod
  IS_GITHUB_ACTIONS: 1

jobs:
  build:
    name: windows-x64
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-flutter
        with:
          platform: windows

      - name: Build the Release tree
        run: make windows-validate

      - name: Upload the build
        uses: actions/upload-artifact@v6
        with:
          name: Hiddify-HWID-Windows
          path: build/windows/x64/runner/Release
          if-no-files-found: error
          retention-days: 30

      - name: Publish a release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="hwid-${GITHUB_RUN_NUMBER}"
          cp build/windows/x64/runner/Release/data/app.so app.so
          (cd build/windows/x64/runner/Release && 7z a -tzip ../../../../../Hiddify-HWID-Windows.zip . >/dev/null)
          gh release create "$tag" Hiddify-HWID-Windows.zip app.so --target "$GITHUB_SHA" --title "Hiddify HWID $tag" --notes "Unsigned Windows build with x-hwid headers." --prerelease
